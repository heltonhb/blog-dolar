services:
  - type: web
    name: blog-dolar-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WP_DB_HOST
        sync: false
      - key: WP_DB_USER
        sync: false
      - key: WP_DB_PASS
        sync: false
      - key: WP_DB_NAME
        sync: false
      - key: FTP_HOST
        sync: false
      - key: FTP_USER
        sync: false
      - key: FTP_PASS
        sync: false
      # Monetização: Amazon Associates, VPN & Display Ads
      - key: AMAZON_ASSOCIATE_TAG
        sync: false
      - key: NORDVPN_AFFILIATE_URL
        sync: false
      - key: MONETAG_TAG_ID
        sync: false
      - key: INFOLINKS_PID
        sync: false
      # Pinterest Safe Bridge
      - key: BRIDGE_ENABLED
        sync: false
      - key: BRIDGE_BASE_URL
        sync: false
      - key: BRIDGE_REDIRECT_SECONDS
        sync: false
      # Google Analytics 4 & Search Console
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GA4_PROPERTY_ID
        sync: false
      # Pinterest API
      - key: PINTEREST_ACCESS_TOKEN
        sync: false
      - key: PINTEREST_BOARD_ID
        sync: false
      - key: SITE_URL
        value: https://techtips.dpdns.org
      - key: WP_USER
        sync: false
      - key: WP_APP_PASSWORD
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      # Cron jobs run on exactly ONE instance (advisory lock in Postgres), so
      # enabling it does not duplicate pipeline runs across Render's dynos.
      # Leave off unless you actually want scheduled publishing.
      - key: ENABLE_SCHEDULER
        sync: false
    disk:
      name: dashboard-data
      mountPath: /opt/render/project/src/dashboard/data
      sizeGB: 1
